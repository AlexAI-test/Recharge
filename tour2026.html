<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Recharge — Tour 2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO (identic cu pagina principală) -->
  <section class="hero">
    <h1>Recharge Tour 2026</h1>
    <p>Electric Road Trip • 11 zile • 4500 km</p>
  </section>

    <!-- CARS PARTICIPANTE -->
  <section class="cars">
    <h2>Mașini participante</h2>

    <div class="car-grid">

      <!-- Exemplu card mașină -->
      <div class="car-card">
        <img src="images/audi.jpg" alt="Audi e-tron">
        <div class="overlay">
          <p>Audi e-tron</p>
          <p>putere: 300 kW</p>
          <p>baterie: 95 kWh</p>
        </div>
      </div>

      <div class="car-card">
        <img src="images/volvo.jpg" alt="Volvo EX30">
        <div class="overlay">
          <p>Volvo EX30</p>
          <p>putere: 200 kW</p>
          <p>baterie: 69 kWh</p>
        </div>
      </div>

      <div class="car-card">
        <img src="images/porsche.jpg" alt="Porsche Taycan">
        <div class="overlay">
          <p>Porsche Taycan</p>
          <p>putere: 440 kW</p>
          <p>baterie: 93 kWh</p>
        </div>
      </div>

      <!-- Poți adăuga restul mașinilor aici -->

    </div>
  </section>

</body>
</html>
